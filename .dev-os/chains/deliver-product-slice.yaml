schema_version: 1
id: deliver-product-slice
name: Deliver Product Slice
mirror_skill: deliver-product-slice
description: >-
  Close one product slice end-to-end — from spec shaping through implementation,
  quality gates, PR handoff, and merge. Runs the canonical DevOS process: shape spec, write spec,
  close gaps, create tasks, implement, test, verify, review, push/create PR, merge. Distinct from feature-branch
  (which includes full planning and architecture phases) — use this when the spec is
  already partially understood and you want the shortest path from idea to merged slice.
category: development
work_intake_policy: runtime-aware
confirm: false
model_route: standard
skills:
  - {name: work-intake-preflight, args: "--auto"}
  - worktrees
  - worktree-sessions
  - checkpoint
  - shape-spec
  - write-spec
  - {name: gap-analysis, args: "--dalio --converge --fix"}
  - create-tasks
  - devos-verify
  - implement-tasks
  - ai-slop-polish
  - harden
  - devos-security-review
  - test
  - devos-verify
  - user-facing-docs
  - docs-sync
  - audit-docs
  - {name: commit, args: "--grouped --local-only"}
  - devos-code-review
  - {name: sync-completed-work, args: "--unattended"}
  - {name: commit, args: "--grouped --local-only"}
  - create-pr
  - {name: sync-completed-work, args: "--unattended"}
  - merge-feature
  - {name: post-deploy-qa, args: "--record-debt-only --reason pending_no_url --source-chain deliver-product-slice"}
  - devos-review
  - {name: commit, args: "--stage-only"}
  - summarize
clients:
  - omp
  - claude-code
  - codex
  - gemini
  - opencode
  - pi
  - zed
intent_keywords:
  - deliver slice
  - product slice
  - ship feature
  - finish this feature
  - deliver feature
  - close feature
  - ship this
  - end to end slice
  - slice to merge
source_doc: docs/guides/chains.md
