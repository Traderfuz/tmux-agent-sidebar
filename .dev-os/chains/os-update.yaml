schema_version: 1
id: os-update
name: Update All OSes
mirror_skill: os-update
description: >-
  Update every OS package installed in a project from an explicitly approved plan.
  Prepare fetches metadata without moving HEAD. One operator decision supplies the
  plan digest, operation id, and expected revision. Apply then fast-forwards only
  to that pinned commit, syncs, and verifies. A changed plan, dirty or divergent
  source, lock contention, stale revision, or unknown outcome stops before effects.
category: maintenance
work_intake_policy: runtime-aware
confirm: true
worktree_policy_exception: none
model_route: standard
skills:
  - os-update
clients:
  - omp
  - claude-code
  - codex
  - gemini
  - opencode
  - pi
  - zed
intent_keywords:
  - update oses
  - update all oses
  - sync os versions
  - update content oses
  - refresh os installs
  - os versions stale
  - update os fleet
  - os update project
source_doc: docs/runbooks/os-version-sync.md
