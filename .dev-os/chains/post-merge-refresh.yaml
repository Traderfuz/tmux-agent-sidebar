schema_version: 1
id: post-merge-refresh
name: Post-Merge Refresh
mirror_skill: post-merge-refresh
description: "Refresh docs, user flows, roadmap, and stale worktrees/branches after a feature merge from an isolated worktree. Mirrored by the post-merge-refresh skill, which is also the chain step skill-authoring and skill-maintenance use to close out after merge."
category: maintenance
work_intake_policy: runtime-aware
skills:
  - {name: work-intake-preflight, args: "--auto"}
  - worktrees
  - checkpoint
  - docs-sync
  - audit-docs
  - generate-agents-md
  - generate-user-flows
  - {name: dogfood, args: "--post-merge --non-blocking --surface auto --source-chain post-merge-refresh"}
  - {name: post-deploy-qa, args: "--record-debt-only --reason pending_no_url --source-chain post-merge-refresh"}
  - orchestrate
  - {name: commit, args: "--all"}
  - summarize
  - {name: commit, args: "--all"}
confirm: false
clients:
  - omp
  - claude-code
  - codex
  - gemini
  - opencode
  - pi
  - zed
intent_keywords:
  - post-merge
  - after merge
  - refresh docs
  - pmrq
  - merge refresh
source_doc: docs/guides/chains.md
