schema_version: 1
id: cross-os-skill-audit
name: Cross-OS Skill Utilization and Vendoring Audit
description: Build an evidence-backed, approval-gated plan that audits global DevOS skills against every detected installable OS for activation, discoverability, command wiring, sync drift, skill quality, and justified vendoring opportunities.
category: maintenance
work_intake_policy: runtime-aware
parameters:
  - {name: --os, type: string, repeatable: true, description: "Limit the audit to one or more canonical OS package IDs; comma-separated values are accepted and normalized in first-seen order."}
skills:
  - {name: work-intake-preflight, args: "--auto"}
  - worktrees
  - {name: os-orchestrate, args: '--goal "Run the Cross-OS Skill Utilization and Vendoring Audit with scope_origin={scope_origin} and selected_os_packages={selected_os_packages} supplied by the chain runner. For explicit scope, accept canonical IDs from installed entries in the consuming root os-registry.yml, the consuming root manifest.json canonical source package, or immediate sibling *-os/manifest.json source packages, resolve each selected source path from that evidence, and audit only selected package skill source, profile, installed mirror, command, registry, telemetry, ownership, synchronization, and benchmark surfaces; for default-all scope preserve existing detection and report exact detected IDs. Treat global DevOS skill catalog reads as comparison-only. Missing 30-day activation telemetry is unknown with evidence provenance, never zero. Produce one aggregate report exposing scope_origin, requested_package_ids, resolved_package_ids, rejected_package_ids, selected_package_count, exact ordered selected IDs, zero-selected state, per-package evidence references and findings classified only as vendor, shared, OS-exclusive, improve-routing, keep-global, or retire. Revision 1 is strictly read-only: do not invoke mutating modes or write any selected or unselected OS package source, profile, mirror, command, registry, or skill content. Any non-empty remediation candidate set is a material revision 2, invalidates revision 1 approval, and requires a second explicit approval naming selected owners; route command work to commands-to-skills or bx-command-creator, skill quality/discoverability to bx-skill-creator, synchronization/vendoring to sync-skills, and ownership/registry defects to ownership-audit. Record producer-owned verification and unknown/failed outcomes; never mark remediation complete without it. Do not dispatch or route back to the cross-os-skill-audit chain."'}
confirm: false
model_route: complex
clients:
  - omp
  - claude-code
  - codex
  - gemini
  - opencode
  - pi
  - zed
intent_keywords:
  - cross-os skill audit
  - skill utilization audit
  - skill vendoring audit
  - unused skills
  - underused skills
  - vendor global skills
  - cross os skill usage
  - skill activation audit
  - skill routing efficiency
source_doc: docs/guides/chains.md
