# MyPy Strict Configuration Template for DevOS Projects
# Copy this section to your pyproject.toml and adjust as needed

[tool.mypy]
# Strict mode (enables comprehensive type checking)
# Includes: disallow_untyped_defs, disallow_any_generics, etc.
strict = true

# Additional warnings beyond strict mode
warn_unreachable = true
warn_return_any = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

# Import discovery
namespace_packages = true
explicit_package_bases = true

# Caching
cache_dir = ".mypy_cache"
sqlite_cache = true

# Python version (adjust for your project)
python_version = "3.11"

# Exclude directories from type checking
exclude = [
    "build/",
    "dist/",
    ".eggs/",
    ".venv/",
    "venv/",
    "node_modules/",
]

# Override settings for specific modules

# Test files - allow some flexibility
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["var-annotated", "has-type"]

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
]
ignore_missing_imports = true

