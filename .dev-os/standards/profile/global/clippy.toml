# Clippy Configuration Template for DevOS Projects
# Copy this file to your project root as .clippy.toml

# Pedantic lints - stricter than default
too-many-arguments-threshold = 7
type-complexity-threshold = 250
array-size-threshold = 512000
vec-box-size-threshold = 4096
stack-size-threshold = 512000
enum-variant-size-threshold = 200
verbose-bit-mask-threshold = 1

# Literal representation threshold
literal-representation-threshold = 10

# Maximum function lines before warning
function-lines = 100

# Maximum struct field visibility before warning
struct-field-visibility-threshold = 3

# Documentation requirements
missing-docs-in-private-items = false

# Disallow certain patterns
# These will cause clippy to emit errors
disallowed-methods = []
disallowed-types = []
disallowed-scripts = []

# Cognitive complexity threshold
cognitive-complexity-threshold = 30

# Single char binding names threshold
single-char-binding-names-threshold = 4

# Literal digit grouping (e.g., 1_000_000 instead of 1000000)
literal-representation = "DigitGrouping"

# Allow expect/unwrap in tests (uncomment for strict mode)
# allow-expect-in-tests = false
# allow-unwrap-in-tests = false

# Allow print macros (uncomment to deny)
# allowed-scripts = []

# Suppress lints from dependencies (useful for workspace)
suppress-lint = []

# Standard macro braces
standard-macro-braces = []
